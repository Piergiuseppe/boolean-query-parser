name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . --verbose

  release-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the release tag matches the packaged version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'CHECK'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          tag = os.environ["TAG"].removeprefix("v")
          if tag != version:
              sys.exit(
                  f"release tag {tag!r} does not match pyproject.toml ({version!r}); "
                  f"PyPI versions cannot be reused, so this run stops before publishing"
              )
          print(f"tag and pyproject agree on {version}")
          CHECK

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the wheel installs and reports its version
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          expected=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          imported=$(cd /tmp && /tmp/check/bin/python -c "import boolean_query_parser; print(boolean_query_parser.__version__)")
          echo "pyproject=$expected  import=$imported"
          test "$imported" = "$expected"

      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/boolean_query_parser
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
